---
# Describes the format for available services for audiconnect

probe_api_paths:
  name: Probe known read-only Audi API paths
  description: >
    V2 only. For V3 use its Engineering Workbench. On-demand, rate-limited
    validation of eight known CARIAD GET endpoints for a single vehicle. No
    remote control actions. Results appear in the next
    Home Assistant Download diagnostics export. Only run when investigating
    missing vehicle data. Extended mode adds four experimental GET-only checks,
    including climate timers, measurements, inspection and trip statistics.
    Re-running with a different mode within 15 minutes is rejected.
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect
    extended:
      selector:
        boolean:

set_local_dealer:
  name: Set local dealer and service information
  description: >-
    Optional details kept locally in Home Assistant. No Audi API requests.
    Fields not supplied keep their previous values. Empty text removes a field.
    Clear removes the whole local record for this vehicle.
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect
    dealer_name:
      selector:
        text:
    dealer_city:
      selector:
        text:
    dealer_address:
      selector:
        text:
    dealer_phone:
      selector:
        text:
    dealer_website:
      selector:
        text:
          type: url
    next_service_date:
      selector:
        date:
    warranty_expiry:
      selector:
        date:
    clear:
      selector:
        boolean:

refresh_vehicle_data:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect

execute_vehicle_action:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect
    action:
      required: true
      example: "lock"
      selector:
        select:
          translation_key: vehicle_actions
          options:
            - lock
            - unlock
            - start_climatisation
            - stop_climatisation
            - start_charger
            - start_timed_charger
            - stop_charger
            - start_preheater
            - stop_preheater
            - start_window_heating
            - stop_window_heating

start_climate_control:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect
    temp_f:
      selector:
        number:
          min: 59
          max: 85
    temp_c:
      selector:
        number:
          min: 15
          max: 30
    glass_heating:
      selector:
        boolean:
    seat_fl:
      selector:
        boolean:
    seat_fr:
      selector:
        boolean:
    seat_rl:
      selector:
        boolean:
    seat_rr:
      selector:
        boolean:
    climatisation_at_unlock:
      selector:
        boolean:
    climatisation_mode:
      example: "comfort"
      selector:
        select:
          options:
            - comfort
            - economy

start_auxiliary_heating:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect
    duration:
      selector:
        number:
          min: 10
          max: 60
          step: 10
          unit_of_measurement: "minutes"

set_location_charge_target:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect
    profile_id:
      example: 1
      selector:
        number:
          min: 1
          max: 10
          step: 1
    target_soc:
      required: true
      example: 80
      selector:
        number:
          min: 20
          max: 100
          step: 5
          unit_of_measurement: "%"

set_charge_mode:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect
    charge_mode:
      required: true
      example: "manual"
      selector:
        select:
          options:
            - manual
            - timer

set_target_soc:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect
    target_soc:
      required: true
      example: 80
      selector:
        number:
          min: 20
          max: 100
          step: 5
          unit_of_measurement: "%"

start_engine:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect

stop_engine:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect
