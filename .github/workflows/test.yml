name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha: [baseline, "2026.11.1"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Home Assistant 2026.7 declares Requires-Python >=3.14.2.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        env:
          HA_TARGET: ${{ matrix.ha }}
        run: |
          if [ "$HA_TARGET" = baseline ]; then
            pip install -r requirements-test.txt
          else
            sed "s/^homeassistant==.*/homeassistant==$HA_TARGET/" requirements-test.txt > "$RUNNER_TEMP/requirements-test.txt"
            pip install -r "$RUNNER_TEMP/requirements-test.txt"
          fi

      - name: Run tests
        run: pytest

      - name: Node Workbench syntax and interaction tests
        if: matrix.ha == 'baseline'
        run: |
          node --check custom_components/audiconnect/v3/frontend/panel.js
          node --test tests/test_v3_workbench_ui.mjs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install pinned Ruff
        run: pip install ruff==0.17.4
      - name: Ruff lint (complete concise report)
        run: ruff check --output-format concise .
      - name: Run upstream pre-commit hooks
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure
