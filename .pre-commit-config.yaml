---
minimum_pre_commit_version: "3.6.0"

ci:
  autoupdate_commit_msg: "chore: pre-commit autoupdate"
  autofix_commit_msg: "style: apply pre-commit fixes"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args:
          - --maxkb=1000

      - id: check-case-conflict

      - id: check-executables-have-shebangs
        stages:
          - manual

      - id: check-json
        exclude: ^(?:\.vscode|\.devcontainer)/

      - id: check-merge-conflict

      - id: check-toml

      - id: check-yaml
        args:
          - --unsafe

      - id: debug-statements

      - id: detect-private-key

      - id: end-of-file-fixer

      - id: mixed-line-ending
        args:
          - --fix=lf

      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args:
          - --fix

      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args:
          - --ignore-words-list=fro,hass
          - --skip=./.*,*.csv,*.json,*.ambr
          - --quiet-level=2
        exclude_types:
          - csv
          - json

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        exclude: ^(?:\.github|\.vscode|\.devcontainer)/

  # The official mirrors-prettier repository is archived.
  # Prettier is therefore installed directly as an isolated Node dependency.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --write --ignore-unknown
        language: node
        additional_dependencies:
          - prettier@3.6.2
        types_or:
          - css
          - html
          - javascript
          - json
          - markdown
          - yaml

  # Run manually when modernizing type annotations:
  #
  # pre-commit run --hook-stage manual python-typing-update --all-files
  #
  # This hook can require manual follow-up work.
  - repo: https://github.com/cdce8p/python-typing-update
    rev: v0.8.1
    hooks:
      - id: python-typing-update
        stages:
          - manual
        args:
          - --py311-plus
          - --force
          - --keep-updates
        types:
          - python

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        stages:
          - manual
        args:
          - --ignore-missing-imports
        types:
          - python
